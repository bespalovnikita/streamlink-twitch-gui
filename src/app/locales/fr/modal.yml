dialog:
    action:
        close: Fermer
changelog:
    header: "Vous avez mis à jour vers la version {version}"
    body: Voulez-vous voir ce qu'il y a de nouveau et lire le changelog maintenant ?
    action:
        show: Changelog
confirm:
    header: Confirmer
    body: Voulez-vous appliquer vos changements?
    action:
        apply: Appliquer
        discard: Abandonner
        cancel: Annuler
debug:
    header: "Version de débogage: {version}"
    body: |
        Vous exécutez une version de débogage de {name}.<br>
        Soyez prudent avec ce que vous faites et signalez tout problème que vous pourriez trouver.<br>
        Merci!
    action:
        close: Okay
firstrun:
    header: "Configurer la lecture"
    body: "Pour regarder des streams, installez Streamlink et un lecteur vidéo externe tel que VLC ou mpv. Indiquez leurs chemins dans les paramètres si nécessaire."
    action:
        start: "Continuer"
        streamlink: "Configurer Streamlink"
        player: "Configurer le lecteur vidéo"
newrelease:
    header: "Vous utilisez une version obsolète: {version}"
    body: "Voulez-vous télécharger la dernière version maintenant ? ({version})"
    action:
        download: Télécharger
        ignore: Ignorer
quit:
    header: Êtes-vous sûr de vouloir quitter ?
    body:
        streams: En choisissant d'arrêter, tous les streams seront coupés.
        no-streams: Tous les streams ont été coupés. Voulez-vous quitter maintenant ?
    action:
        close: Retour
        shutdown: Arrêter
        quit: Quitter
streaming:
    header:
        preparing: "Préparation, veuillez patienter"
        launching: "Lancement: {channel}"
        watching: "En visionnage: {channel}"
        ended: "Le stream est terminé: {channel}"
        error:
            log: "Erreur: impossible de lancer le stream"
            provider: "Erreur: {provider} configuration incorrecte"
            player: "Erreur: Configuration incorrecte du lecteur"
            version: "Erreur: Version {provider} incorrecte"
            unable-to-open: "Erreur: Impossible d'ouvrir le stream"
            no-streams-found: "Erreur: Aucun sream trouvé"
            timeout: "Erreur: Timeout"
            internal: "Erreur"
    body:
        warning: "Avertissement"
        launching: "En attente de {provider} de lancer le stream..."
        ended: "Voulez-vous relancer le stream maintenant ?"
        error:
            diagnostics: "Ouvrez le diagnostic pour en savoir plus."
            provider: "Veuillez vérifier vos paramètres et/ou (ré)installer {provider}."
            player: "Veuillez vérifier les paramètres du lecteur."
            version: "La version v{version} ne remplit pas les exigences minimales. (v{required})."
            unable-to-open: "{provider} n'a pas réussi à ouvrir le stream."
            no-streams-found: "{provider} n'a pas réussi à trouver le stream."
            timeout: "Soit {name} est hors ligne, soit votre connexion à Twitch a été interrompue."
            internal: "Erreur interne"
    quality:
        label: "Qualité"
        restart: "Appliquer un changement de qualité redémarre la lecture."
    action:
        player-settings: "Ouvrir les paramètres du lecteur"
        provider-settings: "Ouvrir les paramètres du fournisseur"
        abort: Abandonner
        continue: "Retour à l’application"
        download: Télécharger
        log: "Diagnostic ({provider})"
        restart: Redémarrer
        shutdown: Fermer le stream
