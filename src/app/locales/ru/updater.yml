title: Обновление приложения
description: При запуске приложение проверяет наличие новых сборок master. Настройки и авторизация сохранятся.
current-version: "Текущая версия: {version}"
current-commit: "Сборка: {commit}"
available-version: "Новая версия: {version}"
status:
    idle: Можно проверить наличие обновлений.
    checking: Проверяем наличие обновлений…
    current: Установлена последняя доступная сборка master.
    available: Доступна новая сборка master.
    downloading: Скачиваем обновление…
    preparing: Проверяем и подготавливаем обновление…
    ready: Обновление готово к установке. Перезапустите приложение, когда будете готовы.
    installing: Перезапускаем приложение для установки обновления…
    error: Не удалось завершить обновление.
    unsupported: Для этой сборки автоматическое обновление недоступно.
action:
    check: Проверить обновления
    download: Скачать обновление
    cancel: Отменить загрузку
    later: Позже
    skip: Пропустить эту версию
    restart: Перезапустить и установить
    confirm-restart: Всё равно перезапустить
    back: Назад
warning:
    streams: При перезапуске приложения открытые трансляции могут закрыться. Перезапустить и установить обновление?
    settings: Есть неприменённые настройки. Сохраните или отмените их в настройках перед перезапуском.
error:
    rollback: Обновление не удалось завершить. Восстановлена предыдущая версия приложения; ваши настройки сохранены.
    generic: Не удалось обновить приложение. Повторите попытку.
    offline: Не удалось связаться с сервером обновлений. Проверьте подключение к интернету и повторите попытку.
    unsupported: Эта сборка не поддерживает автоматическое обновление. Используйте переносную сборку для Windows x64 или Linux x64.
    download: Не удалось скачать обновление. Проверьте подключение к интернету и повторите попытку.
    integrity: Скачанное обновление не прошло проверку. Скачайте его заново.
    archive: Не удалось распаковать обновление. Скачайте его заново.
    location: В этой папке нельзя обновить приложение. Перенесите его в папку с правом записи и повторите попытку.
    permission: Нет права записи в папку приложения. Проверьте разрешения папки и повторите попытку.
    busy: Обновление уже выполняется. Дождитесь его завершения.
    start: Не удалось запустить установку обновления. Повторите попытку.
    settings: Сохраните или отмените неприменённые настройки перед перезапуском для установки обновления.
progress: "Скачано: {percent}%"
