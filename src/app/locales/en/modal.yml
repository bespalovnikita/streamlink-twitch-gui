dialog:
    action:
        close: Close
changelog:
    header: "You just upgraded to {version}"
    body: Do you want to see what's new and read the changelog now?
    action:
        show: Changelog
confirm:
    header: Please confirm
    body: Do you want to apply your changes?
    action:
        apply: Apply
        discard: Discard
        cancel: Cancel
debug:
    header: "Debug build: {version}"
    body: |
        You are running a debug build of {name}.<br>
        Please be careful with what you're doing and report any issues you may find.<br>
        Thank you!
    action:
        close: Okay
firstrun:
    header: "Set up playback"
    body: "To watch streams, install Streamlink and an external video player such as VLC or mpv. Set their paths in Settings if needed."
    action:
        start: "Continue"
        streamlink: "Configure Streamlink"
        player: "Configure video player"
newrelease:
    header: "You're using an outdated version: {version}"
    body: "Do you want to download the latest release now? ({version})"
    action:
        download: Download
        ignore: Ignore
quit:
    header: Are you sure you want to quit?
    body:
        streams: By choosing shutdown, all streams will be closed, too.
        no-streams: All streams have been closed. Do you want to quit now?
    action:
        close: Return
        shutdown: Shutdown
        quit: Quit
streaming:
    header:
        preparing: "Preparing stream"
        launching: "Launching: {channel}"
        watching: "Watching: {channel}"
        ended: "Stream ended: {channel}"
        error:
            log: "Error: Couldn't launch the stream"
            provider: "Error: {provider} misconfiguration"
            player: "Error: Player misconfiguration"
            version: "Error: Invalid {provider} version"
            unable-to-open: "Error: Unable to open stream"
            no-streams-found: "Error: No streams found"
            timeout: "Error: Timeout"
            internal: "Error"
    body:
        warning: "Warning"
        launching: "Waiting for {provider} to launch the stream..."
        ended: "Do you want to restart the stream now?"
        error:
            diagnostics: "Open diagnostics for more information."
            provider: "Please check your settings and/or (re)install {provider}."
            player: "Please check your player settings."
            version: "The version v{version} doesn't match the min. requirements (v{required})."
            unable-to-open: "{provider} was unable to open the stream."
            no-streams-found: "{provider} was unable to find the stream."
            timeout: "Either {name} has gone offline, or your connection to Twitch has been interrupted."
            internal: "Internal error"
    quality:
        label: "Quality"
        restart: "Applying a quality change restarts playback."
    action:
        player-settings: "Open player settings"
        provider-settings: "Open provider settings"
        abort: Abort
        continue: "Back to app"
        download: Download
        log: "Diagnostics ({provider})"
        restart: Restart
        shutdown: Close stream
