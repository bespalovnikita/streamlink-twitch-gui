dialog:
    action:
        close: 關閉
changelog:
    header: "已更新為 {version}"
    body: 察看最新消息及更新日誌?
    action:
        show: 更新日誌
confirm:
    header: 請確認
    body: 套用變更?
    action:
        apply: 套用
        discard: 復原
        cancel: 取消
debug:
    header: "偵錯用版本: {version}"
    body: |
        你正在執行偵錯用的 {name}.<br>
        請小心你目前所做的動作，並盡可能的回報你所發現的問題<br>
        非常感謝你！
    action:
        close: Okay
firstrun:
    header: "設定播放"
    body: "觀看實況需要安裝 Streamlink 以及 VLC 或 mpv 等外部播放器。若有需要，可在設定中指定程式路徑。"
    action:
        start: "繼續"
        streamlink: "設定 Streamlink"
        player: "設定播放器"
newrelease:
    header: "目前版本為 {version}，版本已過時"
    body: "需要下載新版嗎? ({version})"
    action:
        download: 下載
        ignore: 忽略
quit:
    header: 是否要離開?
    body:
        streams: 選擇關閉將會中斷所有觀看中的實況
        no-streams: 實況將會中斷，請確認是否要離開?
    action:
        close: 返回
        shutdown: 關閉
        quit: 離開
streaming:
    header:
        preparing: "準備中，請稍候"
        launching: "讀取中: {channel}"
        watching: "收看中: {channel}"
        ended: "實況已結束: {channel}"
        error:
            log: "錯誤: 無法讀取實況"
            provider: "錯誤: {provider} 設定錯誤"
            player: "錯誤: 播放器設定錯誤"
            version: "錯誤: {provider} 版本不符"
            unable-to-open: "錯誤: 無法開啟實況"
            no-streams-found: "錯誤: 找不到實況"
            timeout: "錯誤: 已逾時"
            internal: "錯誤"
    body:
        warning: "警告"
        launching: "等待 {provider} 讀取實況中..."
        ended: "重新啟動實況?"
        error:
            diagnostics: "開啟診斷資訊以查看詳細內容。"
            provider: "請檢查你的設定或重新安裝 {provider}."
            player: "請檢查你的播放器設定"
            version: "目前版本 v{version} 不符合最低版本需求 (v{required})"
            unable-to-open: "{provider} 無法開啟實況"
            no-streams-found: "{provider} 無法找到實況"
            timeout: "{name} 已離線或與 Twitch 的連線中斷"
            internal: "內部錯誤"
    quality:
        label: "畫質"
        restart: "套用畫質變更後將重新開始播放。"
    action:
        player-settings: "開啟播放器設定"
        provider-settings: "開啟提供程式設定"
        abort: 中斷
        continue: "返回應用程式"
        download: 下載
        log: "診斷資訊（{provider}）"
        restart: 重新啟動
        shutdown: 中斷實況
